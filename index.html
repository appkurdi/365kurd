<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- کۆدەکانی ئەپڵیکەیشنی ڕاستەقینە (PWA) -->
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Kurd365 - ئەپی وەرزشی</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
        
        :root {
            --primary-bg: #0d0d0d;
            --secondary-bg: #1a1a1c;
            --card-bg: #242426;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #0a84ff;
            --accent-gradient: linear-gradient(135deg, #0a84ff, #30d0fe);
            --story-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --border-color: #38383a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Cairo', Tahoma, sans-serif; background-color: var(--primary-bg); 
            color: var(--text-main); margin: 0; padding: env(safe-area-inset-top) 0 calc(85px + env(safe-area-inset-bottom)) 0; 
            overflow-x: hidden;
        }

        /* هێدەری سەرەوە */
        .navbar { 
            position: sticky; top: 0; z-index: 1000;
            background: rgba(13, 13, 13, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .navbar h1 { margin: 0; font-size: 26px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }

        /* ستۆرییەکان */
        .stories-container {
            display: flex; overflow-x: auto; gap: 15px; padding: 20px 0;
            scrollbar-width: none; border-bottom: 1px solid var(--border-color); margin-bottom: 15px;
        }
        .stories-container::-webkit-scrollbar { display: none; }
        .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 65px; cursor: pointer; }
        .story-ring {
            width: 68px; height: 68px; border-radius: 50%; padding: 3px;
            background: var(--story-gradient); display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .story-item:active .story-ring { transform: scale(0.9); }
        .story-ring img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--primary-bg); background: #fff; object-fit: cover; }
        .story-item span { font-size: 12px; font-weight: 700; color: var(--text-muted); }

        /* نیشاندەری ستۆری */
        #story-viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: none; flex-direction: column;
        }
        .story-progress-container { display: flex; gap: 5px; padding: 40px 10px 15px 10px; }
        .story-progress-bar { height: 3px; background: rgba(255,255,255,0.3); flex: 1; border-radius: 3px; overflow: hidden; }
        .story-progress-fill { height: 100%; width: 0%; background: #fff; }
        .story-header { display: flex; align-items: center; padding: 0 15px; gap: 10px; }
        .story-header img { width: 35px; height: 35px; border-radius: 50%; }
        .story-header span { font-weight: bold; font-size: 14px; }
        .story-close { margin-right: auto; font-size: 28px; cursor: pointer; color: #fff; padding: 5px; }
        .story-content { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; text-align: center; }
        .story-content img { max-width: 90%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        
        .page-title { font-size: 20px; font-weight: 800; margin: 15px 0; display: flex; align-items: center; gap: 8px; }
        .page-title::before { content: ''; display: inline-block; width: 4px; height: 20px; background: var(--accent); border-radius: 4px; }

        /* تابەکان */
        .tabs-nav { display: flex; overflow-x: auto; gap: 10px; padding: 5px 0 15px 0; scrollbar-width: none; }
        .tabs-nav::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 8px 16px; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700;
            color: var(--text-muted); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .tab-btn img { width: 20px; height: 20px; filter: grayscale(100%); transition: 0.3s; }
        .tab-btn.active { background: rgba(10, 132, 255, 0.1); border-color: var(--accent); color: var(--accent); }
        .tab-btn.active img { filter: grayscale(0%); }
        
        .tab-content, .view-section { display: none; animation: scaleIn 0.3s forwards; }
        .view-section.active { display: block; }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.97) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .league-card { 
            background: var(--secondary-bg); border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 20px;
        }
        .widget-wrapper { padding: 5px; background: var(--secondary-bg); }
        #powered-by, .powered-by, [id^="powered-by"] { display: none !important; }

        /* کارتی هەواڵەکان */
        .news-card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden; margin-bottom: 20px;
            border: 1px solid var(--border-color); display: flex; flex-direction: column; cursor: pointer; text-decoration: none; color: white;
        }
        .news-img { width: 100%; height: 180px; background-size: cover; background-position: center; }
        .news-content { padding: 15px; }
        .news-title { margin: 0 0 10px 0; font-size: 15px; font-weight: 800; line-height: 1.5; }
        .news-time { color: var(--accent); font-size: 12px; font-weight: 700; }
        #loading-news { text-align: center; padding: 40px 0; color: var(--text-muted); font-weight: bold; }

        /* پڕۆفایل */
        .profile-avatar { 
            width: 85px; height: 85px; background: var(--accent-gradient); border-radius: 50%; 
            margin: 30px auto 15px; display: flex; align-items: center; justify-content: center; 
            font-size: 32px; font-weight: 800; box-shadow: 0 10px 25px rgba(10, 132, 255, 0.4);
        }
        .setting-item {
            display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-color); 
            text-decoration: none; color: var(--text-main); background: var(--secondary-bg); cursor: pointer; transition: 0.2s;
        }
        .setting-item:active { background: var(--card-bg); }
        .setting-item:first-child { border-top-left-radius: 16px; border-top-right-radius: 16px; }
        .setting-item:last-child { border-bottom: none; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
        .setting-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-left: 15px; color: white; }

        /* شریتی خوارەوە */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center;
            padding: 10px 5px calc(15px + env(safe-area-inset-bottom)) 5px; z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: var(--text-muted); cursor: pointer; font-size: 11px; font-weight: 700; transition: 0.3s; width: 25%;
        }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; transition: 0.3s; }
        .nav-item.active { color: var(--accent); }
        .nav-item.active svg { transform: scale(1.15) translateY(-2px); }

    </style>
</head>
<body>

    <!-- هێدەری سەرەوە -->
    <div class="navbar">
        <h1>Kurd365</h1>
    </div>

    <!-- بینەری ستۆری -->

        <div class="tabs-nav">

            <button class="tab-btn" onclick="openSubTab(event, 'match-7', 'match-tab')"><img src="https://imagecache.365scores.com/image/upload/f_auto,w_48,h_48,c_limit,q_auto/v2/Competitions/7">ئینگلتەرا</button>
            <button class="tab-btn" onclick="openSubTab(event, 'match-11', 'match-tab')"><img src="https://imagecache.365scores.com/image/upload/f_auto,w_48,h_48,c_limit,q_auto/v2/Competitions/11">ئیسپانیا</button>

        <div id="match-572" class="match-tab"><div class="league-card"><div class="widget-wrapper"><div data-widget-type="entityScores" data-theme="dark" data-entity-type="league" data-entity-id="572" data-lang="ar" data-widget-id="0584ff28-08a8-43ee-a21e-604bb002689f"></div></div></div></div>
        <div id="match-7" class="match-tab"><div class="league-card"><div class="widget-wrapper"><div data-widget-type="entityScores" data-theme="dark" data-entity-type="league" data-entity-id="7" data-lang="ar" data-widget-id="0584ff28-08a8-43ee-a21e-604bb002689f"></div></div></div></div>

    <!-- بەشی دووەم: ڕیزبەندی -->
    <div id="view-standings" class="container view-section">
        <h2 class="page-title">ڕیزبەندی و گۆڵکاران</h2>
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="openSubTab(event, 'stand-7', 'stand-tab')"><img src="https://imagecache.365scores.com/image/upload/f_auto,w_48,h_48,c_limit,q_auto/v2/Competitions/7">پریمەرلیگ</button>
            <button class="tab-btn" onclick="openSubTab(event, 'stand-11', 'stand-tab')"><img src="https://imagecache.365scores.com/image/upload/f_auto,w_48,h_48,c_limit,q_auto/v2/Competitions/11">لالیگا</button>
            <button class="tab-btn" onclick="openSubTab(event, 'scorers-11', 'stand-tab')">⚽ گۆڵکاران (لالیگا)</button>

        <div id="stand-7" class="stand-tab" style="display: block;"><div class="league-card"><div class="widget-wrapper"><div data-widget-type="standings" data-theme="dark" data-entity-type="league" data-entity-id="7" data-lang="ar"></div></div></div></div>

        <div id="scorers-11" class="stand-tab"><div class="league-card"><div class="widget-wrapper"><div data-widget-type="topScorers" data-theme="dark" data-entity-type="league" data-entity-id="11" data-lang="ar"></div></div></div></div>

    <!-- بەشی سێیەم: هەواڵەکان -->

        <h2 class="page-title">هەواڵە وەرزشییەکان</h2>
        <div id="loading-news">سەرقاڵی هێنانی هەواڵەکانە... ⏳</div>
        <div id="real-news-container"></div>
    </div>

    <!-- بەشی چوارەم: پڕۆفایل -->
    <div id="view-profile" class="container view-section">
        <div class="profile-avatar">K</div>
        <h2 style="text-align:center; margin: 0 0 5px 0;">Kurd365 App</h2>
        <p style="text-align:center; color: var(--text-muted); margin: 0 0 30px 0;">ڤێرژنی فەرمی (V3.5 - 2026)</p>

        <div style="margin-bottom: 20px; padding: 0 10px;">
            <a href="https://t.me/mtv_ibrahim_app" target="_blank" class="setting-item">
                <div class="setting-icon" style="background: #0088cc;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.97 1.25-5.56 3.67-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.06-.49-.83-.27-1.49-.41-1.43-.87.03-.24.36-.48 1-.74 3.92-1.7 6.54-2.83 7.86-3.38 3.74-1.56 4.51-1.83 5.02-1.84.11 0 .36.03.52.16.13.11.17.26.19.37.02.05.02.26.01.4z"/></svg></div>
                <div style="flex: 1; margin-right: 15px; font-weight: 700;">کەناڵی تێلیگرام (@mtv_ibrahim_app)</div>
            </a>
            <div class="setting-item" onclick="refreshScores(this)">
                <div class="setting-icon" style="background: #34c759;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></div>
                <div style="flex: 1; margin-right: 15px; font-weight: 700;" id="refresh-text">نوێکردنەوەی ئەنجامەکان</div>
            </div>
            <div class="setting-item" onclick="alert('گەشەپێدەر: ئیبراهیم خەلیل جەمیل\nئەپی Kurd365')">
                <div class="setting-icon" style="background: #5856d6;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></div>

    <!-- شریتی خوارەوە -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchMainView('view-matches', this)">
            <svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg><span>یارییەکان</span>
        </div>
        <div class="nav-item" onclick="switchMainView('view-standings', this)">
            <svg viewBox="0 0 24 24"><path d="M4 10h3v10H4zm7-6h3v16h-3zm7 10h3v6h-3z"/></svg><span>ڕیزبەندی</span>
        </div>
        <div class="nav-item" onclick="switchMainView('view-news', this); loadRealNews();">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>هەواڵەکان</span>
        </div>
        <div class="nav-item" onclick="switchMainView('view-profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>پڕۆفایل</span>
        </div>
    </div>

    <script>
        // لۆژیکی گۆڕینی پەڕەکان
        function switchMainView(viewId, element) {
            var views = document.getElementsByClassName("view-section");
            for (var i = 0; i < views.length; i++) views[i].className = views[i].className.replace(" active", "");
            var navItems = document.getElementsByClassName("nav-item");
            for (var i = 0; i < navItems.length; i++) navItems[i].className = navItems[i].className.replace(" active", "");
            document.getElementById(viewId).className += " active";
            element.className += " active";
            window.scrollTo(0,0);
        }

        function openSubTab(evt, tabId, contentClass) {
            var content = document.getElementsByClassName(contentClass);
            for (var i = 0; i < content.length; i++) content[i].style.display = "none";
            var links = evt.currentTarget.parentElement.getElementsByClassName("tab-btn");
            for (var i = 0; i < links.length; i++) links[i].className = links[i].className.replace(" active", "");
            document.getElementById(tabId).style.display = "block";
            evt.currentTarget.className += " active";
        }

        // لۆژیکی ستۆرییەکان
        let storyTimer;
        function openStory(teamName, teamId, text) {
            document.getElementById('story-title').innerText = teamName;
            document.getElementById('story-logo').src = `https://imagecache.365scores.com/image/upload/f_auto,w_48,h_48,c_limit,q_auto/v2/Competitors/${teamId}`;
            document.getElementById('story-image').src = `https://imagecache.365scores.com/image/upload/f_auto,w_800,h_400,c_fill,q_auto/v2/Competitors/${teamId}`;
            document.getElementById('story-text').innerText = text;
            
            let viewer = document.getElementById('story-viewer');
            viewer.style.display = 'flex';
            
            let progress = document.getElementById('story-progress');
            progress.style.transition = 'none';
            progress.style.width = '0%';
            setTimeout(() => {
                progress.style.transition = 'width 4s linear';
                progress.style.width = '100%';
            }, 50);

            clearTimeout(storyTimer);
            storyTimer = setTimeout(closeStory, 4000);
        }
        function closeStory() {
            document.getElementById('story-viewer').style.display = 'none';
            clearTimeout(storyTimer);
        }

        // لۆژیکی هێنانی هەواڵەکان
        let newsLoaded = false;
        async function loadRealNews() {
            if(newsLoaded) return;
            try {
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.rudaw.net/sorani/sports/rss');
                const data = await response.json();
                let newsHtml = '';
                if(data.items) {
                    for(let i=0; i<8; i++) {
                        let item = data.items[i];
                        if(item) {
                            let imgSrc = item.enclosure.link || item.thumbnail || 'https://via.placeholder.com/800x400';
                            newsHtml += `
                            <a href="${item.link}" target="_blank" class="news-card">
                                <div class="news-img" style="background-image: url('${imgSrc}');"></div>
                                <div class="news-content">
                                    <h3 class="news-title">${item.title}</h3>
                                    <div class="news-time">سەرچاوە: ڕووداو</div>
                                </div>
                            </a>`;
                        }
                    }
                    document.getElementById('loading-news').style.display = 'none';
                    document.getElementById('real-news-container').innerHTML = newsHtml;
                    newsLoaded = true;
                }
            } catch(e) {
                document.getElementById('loading-news').innerText = "هەڵە لە هێنانی هەواڵەکان.";
            }
        }

        // لۆژیکی دوگمەی نوێکردنەوە (Refresh)
        function refreshScores(btn) {
            let textSpan = document.getElementById('refresh-text');
            textSpan.innerText = "خەریکی نوێکردنەوەیە...";
            
            let oldScript = document.getElementById('scores-script');
            if(oldScript) oldScript.remove();
            
            let newScript = document.createElement('script');
            newScript.id = 'scores-script';
            newScript.src = "https://widgets.365scores.com/main.js?v=" + new Date().getTime();
            document.body.appendChild(newScript);
            
            setTimeout(() => {
                textSpan.innerText = "بە سەرکەوتوویی نوێ کرایەوە!";
                setTimeout(() => textSpan.innerText = "نوێکردنەوەی ئەنجامەکان", 2000);
            }, 1500);
        }
    </script>
    
    <script id="scores-script" src="https://widgets.365scores.com/main.js"></script>
</body>
</html>
